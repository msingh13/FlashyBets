name: Update predictions and publish FlashyBets
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_if_fresh:
        type: boolean
        default: false
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: flashybets-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse a model update that finished while queued
        id: reuse
        env:
          ALLOW_REUSE: ${{ inputs.skip_if_fresh || 'false' }}
        run: |
          python3 - <<'PYREUSE'
          import json,os
          from datetime import datetime,timezone
          from urllib.request import urlopen
          fresh=False
          if os.getenv('ALLOW_REUSE')=='true':
              try:
                  with urlopen('https://raw.githubusercontent.com/msingh13/FlashyBets/model-data/data/flashy-ai.json',timeout=20) as response:
                      snapshot=json.load(response)
                  age=(datetime.now(timezone.utc)-datetime.fromisoformat(snapshot['updated'].replace('Z','+00:00'))).total_seconds()
                  fresh=0<=age<=1200
              except Exception:pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('fresh='+str(fresh).lower()+'\n')
          print('Reuse recent model data:',fresh)
          PYREUSE
      - uses: actions/setup-python@v5
        if: steps.reuse.outputs.fresh != 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        if: steps.reuse.outputs.fresh != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore durable model history
        if: steps.reuse.outputs.fresh != 'true'
        shell: bash
        run: |
          state_dir="$RUNNER_TEMP/flashybets-state"
          state_ref="$(git ls-remote --heads origin model-data)"
          if [ -n "$state_ref" ]; then
            git fetch origin model-data
            git worktree add -B model-data "$state_dir" FETCH_HEAD
          else
            git worktree add --detach "$state_dir" HEAD
            git -C "$state_dir" switch --orphan model-data
          fi
          mkdir -p frontend/public/data
          if [ -d "$state_dir/data" ]; then cp -R "$state_dir/data/." frontend/public/data/; fi
      - name: Install and verify models
        if: steps.reuse.outputs.fresh != 'true'
        run: |
          pip install -r backend/requirements.txt
          cd backend
          python -m pytest -q
      - name: Update schedules, predictions and results
        if: steps.reuse.outputs.fresh != 'true'
        working-directory: backend
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_NEWS_ACCOUNTS: ${{ vars.X_NEWS_ACCOUNTS || 'Underdog__NBA' }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_BOOKMAKER: ${{ vars.ODDS_BOOKMAKER || 'draftkings' }}
          ODDS_REGION: ${{ vars.ODDS_REGION || 'us' }}
          SPORTSDATAIO_KEY: ${{ secrets.SPORTSDATAIO_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          MODEL_STATE: ${{ runner.temp }}/flashybets-state/model-state.json
          PUBLISH_DIR: ../frontend/public/data
        run: python publish.py
      - name: Preserve model record
        if: steps.reuse.outputs.fresh != 'true'
        shell: bash
        run: |
          state_dir="$RUNNER_TEMP/flashybets-state"
          mkdir -p "$state_dir/data"
          cp -R frontend/public/data/. "$state_dir/data/"
          git -C "$state_dir" config user.name 'github-actions[bot]'
          git -C "$state_dir" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$state_dir" add model-state.json data
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m 'Update prospective model record and public snapshots'
            git -C "$state_dir" push origin HEAD:refs/heads/model-data
          fi
      - name: Build dashboard
        if: steps.reuse.outputs.fresh != 'true'
        working-directory: frontend
        env:
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_PUBLISHED_DATA: '1'
          NEXT_PUBLIC_OFFLINE_DEMO: '0'
          NEXT_PUBLIC_BASE_PATH: /FlashyBets
        run: |
          npm ci
          node lib/board.test.cjs
          npm run build
          touch out/.nojekyll
      - uses: actions/configure-pages@v5
        if: steps.reuse.outputs.fresh != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.reuse.outputs.fresh != 'true'
        with:
          path: frontend/out
      - name: Deploy
        if: steps.reuse.outputs.fresh != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
