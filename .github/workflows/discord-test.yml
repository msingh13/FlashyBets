name: Send Discord test slip
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send labeled test slip
        working-directory: backend
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GAMBLY_BOT_USER_ID: ${{ vars.GAMBLY_BOT_USER_ID || '1338973806383071392' }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from urllib.request import urlopen
          from urllib.parse import urlsplit
          from discord_publish import send, slip, instant, SITE
          url=os.getenv('DISCORD_WEBHOOK_URL','')
          p=urlsplit(url)
          if p.scheme!='https' or p.hostname not in ('discord.com','discordapp.com') or not p.path.startswith('/api/webhooks/'):
              raise SystemExit('DISCORD_WEBHOOK_URL is missing or invalid; value not logged')
          with urlopen(SITE+'data/manifest.json',timeout=20) as response:
              manifest=json.load(response)
          with urlopen(SITE+'data/nba/'+manifest['today']+'-favorites.json',timeout=20) as response:
              data=json.load(response)
          now=datetime.now(timezone.utc)
          legs=[dict(p,sport='nba') for p in data.get('moneylines',[]) if not p.get('outcome') and not p.get('current_warning') and instant(p['start'])>now][:1]
          bot_id=os.getenv('GAMBLY_BOT_USER_ID','')
          if not bot_id.isdigit():raise SystemExit('Set GAMBLY_BOT_USER_ID before sending a mention.')
          if not legs:raise SystemExit('No upcoming selections available; no test message sent.')
          content=slip(legs,bot_id)
          send(url,content)
          print('Discord accepted the test slip. No webhook secret was logged.')
          PY
