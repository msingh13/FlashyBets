services:
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_PATH: /data/flashybets.db
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      ODDS_REGION: ${ODDS_REGION:-us}
      ODDS_BOOKMAKER: ${ODDS_BOOKMAKER:-draftkings}
      SPORTSDATAIO_KEY: ${SPORTSDATAIO_KEY:-}
      AUTO_REFRESH: ${AUTO_REFRESH:-1}
      DATA_MODE: ${DATA_MODE:-live}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-600}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    volumes: ["flashybets-data:/data"]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  flashybets-data:
