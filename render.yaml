# Paid service + persistent disk. Review Render's displayed cost before creating.
services:
  - type: web
    name: flashybets-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: off
    disk:
      name: flashybets-record
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_PATH
        value: /data/flashybets.db
      - key: FRONTEND_ORIGIN
        value: https://msingh13.github.io
      - key: AUTO_REFRESH
        value: '1'
      - key: DATA_MODE
        value: live
      - key: REFRESH_SECONDS
        value: '600'
